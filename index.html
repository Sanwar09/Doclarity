<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doclarity — Project Architecture & Information Hub</title>

  <style>
    /* -------------------------------------------------------------------------- */
    /* CSS CUSTOM PROPERTIES & DESIGN SYSTEM (ZERO EXTERNAL DEPENDENCIES)         */
    /* -------------------------------------------------------------------------- */
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2e;
      --bg-card-hover: #1e293b;
      --bg-code: #090d16;
      --bg-input: #111827;
      --border-color: #243049;
      --border-highlight: #3b82f6;

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.25);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;

      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.4);
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
    }

    /* Reset & Base Setup */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-stack);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Accessibility Focus Styling */
    a:focus-visible, button:focus-visible, input:focus-visible, [tabindex="0"]:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 3px;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Layout Containers */
    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .brand-badge {
      font-size: 0.75rem;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      font-weight: 600;
    }

    nav ul {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    nav a:hover {
      color: var(--accent-blue);
    }

    .air-gap-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 30px;
      font-weight: 600;
    }

    .air-gap-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    /* Mobile Nav Toggle */
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      padding: 4rem 0 3rem 0;
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
    }

    .hero-title {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: var(--text-secondary);
      max-width: 800px;
      margin-bottom: 2rem;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Section Component Structure */
    section {
      padding: 3.5rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .section-header {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-description {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Grid Layouts */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* Component Architecture Cards */
    .arch-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      transition: transform var(--transition-fast), border-color var(--transition-fast);
      position: relative;
    }

    .arch-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-highlight);
    }

    .arch-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .arch-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent-blue);
    }

    .arch-tech-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    .arch-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .arch-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Pipeline Workflow Interactive Visualizer */
    .pipeline-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-top: 2rem;
    }

    .pipeline-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      position: relative;
    }

    .pipeline-node {
      background: var(--bg-main);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      user-select: none;
    }

    .pipeline-node:hover, .pipeline-node.active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px var(--accent-blue-glow);
      background: var(--bg-card-hover);
    }

    .pipeline-node.active::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px;
      border-style: solid;
      border-color: var(--accent-blue) transparent transparent transparent;
    }

    .step-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .step-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .pipeline-detail-box {
      margin-top: 2rem;
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .pipeline-detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .pipeline-detail-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-cyan);
    }

    /* API Catalog & Schema Inspector */
    .catalog-container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .catalog-sidebar {
      border-right: 1px solid var(--border-color);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-box {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.8rem;
      color: var(--text-primary);
      font-size: 0.875rem;
    }

    .search-box:focus {
      border-color: var(--accent-blue);
      outline: none;
    }

    .endpoint-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    .endpoint-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: transparent;
      border: 1px solid transparent;
      transition: background var(--transition-fast);
      width: 100%;
      text-align: left;
      color: var(--text-secondary);
    }

    .endpoint-item:hover, .endpoint-item.active {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
      color: var(--text-primary);
    }

    .endpoint-item.active {
      border-left: 3px solid var(--accent-blue);
    }

    .method-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    .method-post {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .method-get {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .endpoint-path-sm {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .catalog-main {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .endpoint-header-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .endpoint-route {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .endpoint-handler {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      background: var(--bg-main);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
    }

    .schema-toggle-bar {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--bg-card-hover);
      color: var(--accent-blue);
    }

    /* Code Block & JSON Syntax Viewer */
    .code-wrapper {
      position: relative;
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all var(--transition-fast);
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .copy-btn.copied {
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
    }

    pre code {
      display: block;
      padding: 1rem;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-primary);
    }

    /* JSON Syntax Coloring Classes */
    .json-key { color: #7dd3fc; }
    .json-string { color: #34d399; }
    .json-number { color: #f472b6; }
    .json-boolean { color: #fbbf24; }
    .json-null { color: #94a3b8; }

    /* Environment Command Center */
    .env-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    .matrix-table th, .matrix-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .matrix-table th {
      background: var(--bg-card);
      color: var(--text-secondary);
      font-weight: 600;

    }

    .matrix-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .env-key {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--accent-purple);
    }

    .env-required {
      color: var(--accent-rose);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .env-optional {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* Quick Setup Guides */
    .setup-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .setup-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
    }

    /* Toast Notification for Clipboard */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--accent-emerald);
      color: var(--text-primary);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Footer */
    footer {
      padding: 2.5rem 0;
      border-top: 1px solid var(--border-color);
      text-size-adjust: 100%;
      background: var(--bg-main
