services:
  server:
    build:
      context: ./server
    container_name: doclarity-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      PYTHON_BIN: python3
    expose:
      - "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - doclarity_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: doclarity-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  doclarity_uploads:
